name: Bundle

# Builds the downloadable artifacts without cutting a release, so a packaging
# change can be proved on the platforms it targets before anyone tags anything.
# The release workflow builds its own copies; this one exists to be run by hand.
on:
  workflow_dispatch:
  # Also on any pull request that touches packaging, so a change there cannot
  # merge unproven. Both Linux artifacts stayed broken from the first commit
  # because nothing ever built them; scoping by path keeps a fifteen-minute
  # build off the pull requests that do not change how anything is packaged.
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/bundle.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and build tooling
        # The bgremove extra, not just dev: a packaged build cannot pip-install
        # into itself, so the segmentation runtime has to be present at freeze
        # time or it is absent from the artifact for good.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bgremove,trash]"
          pip install pyinstaller
      - name: Build the zip
        run: pwsh -File packaging/build_windows.ps1
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: myImages-*-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        # Qt links these at load time; the smoke test starts the binary, so they
        # have to be here even though the bundle carries everything Python.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libfreetype6
      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bgremove,trash]"
          pip install pyinstaller
      - name: Build the Debian package
        run: bash packaging/build_deb.sh
      - name: Build the AppImage
        run: bash packaging/build_appimage.sh
      - name: Install the package into a clean container and run it
        # The check that actually matters, and the one nobody had ever run: the
        # previous packages installed and then died with "bad interpreter".
        run: |
          docker run --rm -v "$PWD":/work:ro ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /work/myimages_*_amd64.deb
            myimages --version
          '
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            myimages_*.deb
            myImages-*-x86_64.AppImage
          if-no-files-found: error
