name: CI

# A pull request runs this workflow already. Without the branch filter, pushing
# to the branch behind that pull request ran it a second time on the identical
# commit, and pushing a release tag ran it a third.
on:
  push:
    branches: [main]
  pull_request:

# Pushing twice in quick succession otherwise leaves the first run grinding
# through a full matrix whose answer nobody wants any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Style and typing do not vary by interpreter, so they run once rather than
    # once per matrix entry. This job needs no Qt system libraries: mypy reads
    # PySide6's bundled stubs and never imports it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check myimages tests
      - name: Format check
        run: black --check myimages tests
      - name: Type check
        run: mypy myimages

  test:
    # pyproject declares requires-python >= 3.10, so every version in that range
    # has to actually run the suite. Testing only the newest lets a construct
    # that needs a later interpreter reach PyPI and fail on a user's machine.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        # ffmpeg powers the video tests. The rest are shared libraries PySide6
        # links against, which the ubuntu-latest image no longer preinstalls.
        # Qt needs them even under QT_QPA_PLATFORM=offscreen: importing QtGui
        # loads libEGL before any platform plugin is chosen.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,trash]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=myimages --cov-report=term-missing --cov-fail-under=90
