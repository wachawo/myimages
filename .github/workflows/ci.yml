name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (for video tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,trash]"
      - name: Lint
        run: ruff check myimages tests
      - name: Format check
        run: black --check myimages tests
      - name: Type check
        run: mypy myimages
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=myimages --cov-report=term-missing --cov-fail-under=90
