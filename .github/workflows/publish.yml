name: Publish

# Releases are cut by hand, so the GitHub release is the single publish trigger.
# Reacting to `push: tags: v*` as well would double-fire whenever a release is
# created from a freshly pushed tag. workflow_dispatch is the retry path (for a
# PyPI outage, for example) and must be started from the same tag.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # ci.yml runs on every push, but a release can be cut from a commit whose CI
    # never ran or was red, so the gate is re-run against the exact released
    # commit. Lint/format/type checks stay in ci.yml: they do not change what
    # ships in the artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        # ffmpeg powers the video tests. The rest are shared libraries PySide6
        # links against, which the ubuntu-latest image no longer preinstalls.
        # Qt needs them even under QT_QPA_PLATFORM=offscreen: importing QtGui
        # loads libEGL before any platform plugin is chosen.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,trash]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=myimages --cov-report=term-missing --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        # `packaging` is installed explicitly rather than relied on as a
        # transitive dependency of build/twine: the version guard below imports
        # it, and an ImportError there must be impossible, not silent.
        run: |
          python -m pip install --upgrade pip
          pip install build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify built version matches the tag
        # The version is declared once, in myimages/__init__.py, and read from
        # there by setuptools. A tag cut without bumping it would silently
        # re-publish (or clash with) the previous version.
        # Tag names come in through env, never through shell interpolation.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            echo "::error::Manual runs must be started from a tag, not a branch."
            exit 1
          fi
          case "$tag" in
            v*) expected="${tag#v}" ;;
            *) echo "::error::Tag '$tag' does not follow the v<version> scheme."; exit 1 ;;
          esac
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel and one sdist, got ${#wheels[@]} and ${#sdists[@]}."
            exit 1
          fi
          built="$(basename "${wheels[0]}")"
          built="${built#myimages-}"
          built="${built%%-*}"
          # Compare canonical PEP 440 forms so v1.0.0-rc1 and 1.0.0rc1 agree.
          # Each canonicalisation is assigned to its own variable first: inside
          # an `if [ ... ]` condition `set -e` is suspended, so a failing
          # `python -c` would yield two empty strings that compare equal and let
          # a wrong version through. As plain assignments the failure aborts.
          canon='import sys; from packaging.utils import canonicalize_version; print(canonicalize_version(sys.argv[1]))'
          expected_canon="$(python -c "$canon" "$expected")"
          built_canon="$(python -c "$canon" "$built")"
          if [ "$expected_canon" != "$built_canon" ]; then
            echo "::error::Tag '$tag' expects version $expected, but the build produced $built. Bump __version__ in myimages/__init__.py."
            exit 1
          fi
          echo "Publishing version $built from tag $tag."
      - name: Check distribution metadata
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  linux-artifacts:
    # The downloadable artifacts. Independent of the PyPI path on purpose: a
    # packaging failure must not hold up the wheel, and the release-assets job
    # below is what waits for both.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libfreetype6
      - name: Install project and build tooling
        # The bgremove extra: a packaged build cannot pip-install into itself,
        # so the segmentation runtime must be present at freeze time.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bgremove,trash]"
          pip install pyinstaller
      - name: Build the Debian package
        run: bash packaging/build_deb.sh
      - name: Build the AppImage
        run: bash packaging/build_appimage.sh
      - name: Install the package into a clean container and run it
        run: |
          docker run --rm -v "$PWD":/work:ro ubuntu:24.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /work/myimages_*_amd64.deb
            myimages --version
          '
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            myimages_*.deb
            myImages-*-x86_64.AppImage
          if-no-files-found: error

  windows-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bgremove,trash]"
          pip install pyinstaller
      - name: Build the zip
        run: pwsh -File packaging/build_windows.ps1
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: myImages-*-windows-x64.zip
          if-no-files-found: error

  macos-artifacts:
    # No universal2 wheel for PySide6, so one build per architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bgremove,trash]"
          pip install pyinstaller
      - name: Build the disk image
        run: bash packaging/build_macos.sh
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: myImages-*-macos-*.dmg
          if-no-files-found: error

  release-assets:
    # Attaching the files is the only step here that needs write access, so it
    # is the only job that gets it.
    needs: [linux-artifacts, windows-artifact, macos-artifacts]
    # Runs even when one platform failed. The four builds are independent, and a
    # queued or flaky macOS runner should not cost the release its Linux and
    # Windows downloads; the step below still fails if nothing at all was
    # produced, and a missing platform is visible in the release itself.
    if: ${{ github.event_name == 'release' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifacts were produced."
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          # --clobber so a re-run after a partial failure replaces rather than
          # refusing; unlike PyPI, release assets can be overwritten.
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # Separate job so the OIDC token is minted only here. Nothing in this job
    # runs project or build-backend code: it downloads the already verified
    # artifacts and uploads them, which keeps the PyPI-authorized credential out
    # of reach of every third-party package pulled in during build and test.
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myimages
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release run must fail loudly if the version already exists on
          # PyPI. A manual retry must not: if a previous attempt uploaded the
          # sdist and then died on the wheel, PyPI answers the re-upload with a
          # permanent 400 and the retry path would be unusable without this.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
